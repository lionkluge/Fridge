<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFridge Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-24">

    <header class="bg-indigo-700 text-white p-6 shadow-md">
        <h1 class="text-2xl font-bold flex items-center gap-2">
            <i data-lucide="refrigerator"></i> SmartFridge Pro
        </h1>
        <p class="text-indigo-200 text-xs mt-1">Dein digitaler Haltbarkeits-Assistent</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <section id="view-dashboard" class="page-view space-y-6">
            <div id="urgent-section" class="hidden">
                <h2 class="text-sm font-bold text-red-600 uppercase tracking-widest mb-3">⚠️ Bald ablaufen</h2>
                <div id="urgent-list" class="space-y-3"></div>
            </div>

            <div>
                <h2 class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-3">Kühlschrank Inhalt</h2>
                <div id="inventory-list" class="space-y-3"></div>
            </div>
        </section>

        <section id="view-scan" class="page-view hidden">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                <div id="reader" class="w-full rounded-lg overflow-hidden"></div>
                <p class="text-xs text-center text-gray-400 mt-4">Kamera auf Barcode richten.</p>
            </div>
        </section>

        <section id="view-recipes" class="page-view hidden space-y-4">
            <h2 class="text-sm font-bold text-gray-500 uppercase tracking-widest">Kochideen für Reste</h2>
            <div id="recipe-list" class="space-y-4"></div>
        </section>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-4 z-50">
        <button onclick="showView('dashboard')" class="nav-link text-indigo-600" data-view="dashboard"><i data-lucide="layout-dashboard"></i></button>
        <button onclick="showView('scan')" class="nav-link text-gray-400" data-view="scan"><i data-lucide="scan-barcode"></i></button>
        <button onclick="showView('recipes')" class="nav-link text-gray-400" data-view="recipes"><i data-lucide="chef-hat"></i></button>
    </nav>

    <script>
        // 1. DATENBANK-SIMULATION
        const productDb = {
            "40001": { name: "Milch", shelfLife: 7 },
            "40002": { name: "Hähnchenbrust", shelfLife: 2 },
            "40003": { name: "Tomaten", shelfLife: 4 },
            "40004": { name: "Käse", shelfLife: 10 }
        };

        let inventory = JSON.parse(localStorage.getItem('fridge_inv') || '[]');

        // 2. LOGIK: RENDER UI
        function updateUI() {
            const urgentList = document.getElementById('urgent-list');
            const invList = document.getElementById('inventory-list');
            const urgentSection = document.getElementById('urgent-section');
            
            urgentList.innerHTML = '';
            invList.innerHTML = '';
            let hasUrgent = false;

            inventory.sort((a,b) => new Date(a.expiry) - new Date(b.expiry)).forEach(item => {
                const days = Math.ceil((new Date(item.expiry) - new Date()) / (1000*60*60*24));
                const card = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                        <div>
                            <p class="font-bold">${item.name}</p>
                            <p class="text-xs ${days <= 2 ? 'text-red-500 font-bold' : 'text-gray-500'}">
                                ${days <= 0 ? 'Abgelaufen!' : days + ' Tage haltbar'}
                            </p>
                        </div>
                        <button onclick="deleteItem(${item.id})" class="text-gray-300 hover:text-red-500"><i data-lucide="trash-2"></i></button>
                    </div>`;

                if (days <= 2) {
                    urgentList.innerHTML += card;
                    hasUrgent = true;
                } else {
                    invList.innerHTML += card;
                }
            });

            urgentSection.classList.toggle('hidden', !hasUrgent);
            renderRecipes();
            lucide.createIcons();
        }

        // 3. LOGIK: REZEPTE
        function renderRecipes() {
            const list = document.getElementById('recipe-list');
            const urgentItems = inventory.filter(i => Math.ceil((new Date(i.expiry) - new Date()) / (1000*60*60*24)) <= 3);
            
            list.innerHTML = urgentItems.length > 0 
                ? urgentItems.map(item => `
                    <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                        <h3 class="font-bold text-indigo-900">Resteverwertung: ${item.name}</h3>
                        <p class="text-sm text-indigo-700">Da dies bald abläuft, probiere ein schnelles ${item.name}-Gericht!</p>
                    </div>`).join('')
                : '<p class="text-center text-gray-400 py-10">Aktuell keine dringenden Reste. Guten Appetit!</p>';
        }

        // 4. SCANNEN & HILFE
        function showView(viewId) {
            document.querySelectorAll('.page-view').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + viewId).classList.remove('hidden');
            if(viewId === 'scan') startScanner();
        }

        function startScanner() {
            const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            scanner.render((code) => {
                const p = productDb[code] || { name: "Neues Lebensmittel", shelfLife: 3 };
                const exp = new Date(); exp.setDate(exp.getDate() + p.shelfLife);
                inventory.push({ id: Date.now(), name: p.name, expiry: exp.toISOString() });
                localStorage.setItem('fridge_inv', JSON.stringify(inventory));
                scanner.clear();
                showView('dashboard');
                updateUI();
            });
        }

        function deleteItem(id) {
            inventory = inventory.filter(i => i.id !== id);
            localStorage.setItem('fridge_inv', JSON.stringify(inventory));
            updateUI();
        }

        window.onload = updateUI;
    </script>
</body>
</html>
