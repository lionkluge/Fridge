<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFridge Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .card-transition { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 font-sans pb-24">

    <header class="bg-indigo-700 text-white p-6 shadow-lg">
        <h1 class="text-2xl font-bold flex items-center gap-3">
            <i data-lucide="snowflake"></i> SmartFridge
        </h1>
        <p class="text-indigo-200 text-sm mt-1">Dein digitaler Haltbarkeits-Assistent</p>
    </header>

    <main class="max-w-lg mx-auto p-4">
        <section id="page-fridge" class="page-section">
            <div id="food-list" class="space-y-4"></div>
        </section>

        <section id="page-scan" class="page-section hidden">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <div id="reader" class="rounded-2xl overflow-hidden"></div>
            </div>
        </section>

        <section id="page-recipes" class="page-section hidden">
            <div id="recipe-list" class="grid gap-4"></div>
        </section>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around p-4">
        <button onclick="switchPage('fridge')" class="flex flex-col items-center text-indigo-600"><i data-lucide="list"></i><span class="text-[10px]">Inventar</span></button>
        <button onclick="switchPage('scan')" class="flex flex-col items-center text-slate-400"><i data-lucide="camera"></i><span class="text-[10px]">Scannen</span></button>
        <button onclick="switchPage('recipes')" class="flex flex-col items-center text-slate-400"><i data-lucide="chef-hat"></i><span class="text-[10px]">Rezepte</span></button>
    </nav>

    <script>
        // Logik für Datumsberechnung
        function getDaysRemaining(expiryDate) {
            const diffTime = new Date(expiryDate) - new Date();
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        // Farb-Logik
        function getStatusColor(days) {
            if (days > 7) return 'bg-emerald-100 border-emerald-500 text-emerald-900';
            if (days > 3) return 'bg-amber-100 border-amber-500 text-amber-900';
            return 'bg-rose-100 border-rose-500 text-rose-900';
        }

        // Inventar-Render
        function renderFridge() {
            const list = document.getElementById('food-list');
            const inventory = JSON.parse(localStorage.getItem('fridge_inventory') || '[]');
            
            list.innerHTML = inventory.length === 0 
                ? '<p class="text-center text-slate-400 py-20">Kühlschrank leer. Scanne ein neues Produkt!</p>'
                : '';

            inventory.sort((a,b) => new Date(a.expiry) - new Date(b.expiry)).forEach(item => {
                const days = getDaysRemaining(item.expiry);
                const card = document.createElement('div');
                card.className = `p-4 border-l-4 rounded-r-2xl shadow-sm ${getStatusColor(days)}`;
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-lg">${item.name}</h3>
                            <p class="text-sm opacity-80">${days >= 0 ? days + ' Tage haltbar' : 'Abgelaufen!'}</p>
                        </div>
                        <button onclick="deleteItem(${item.id})" class="p-2 hover:bg-black/5 rounded-full"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                    </div>
                `;
                list.appendChild(card);
            });
            lucide.createIcons();
        }

        // Einfaches Hinzufügen (für Demo)
        function addProduct(name, daysToAdd) {
            const expiry = new Date();
            expiry.setDate(expiry.getDate() + daysToAdd);
            const inventory = JSON.parse(localStorage.getItem('fridge_inventory') || '[]');
            inventory.push({ id: Date.now(), name, expiry: expiry.toISOString() });
            localStorage.setItem('fridge_inventory', JSON.stringify(inventory));
            renderFridge();
        }

        // Seitenwechsel & Initialisierung
        function switchPage(id) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + id).classList.remove('hidden');
        }

        function deleteItem(id) {
            let inv = JSON.parse(localStorage.getItem('fridge_inventory'));
            inv = inv.filter(i => i.id !== id);
            localStorage.setItem('fridge_inventory', JSON.stringify(inv));
            renderFridge();
        }

        window.onload = () => { renderFridge(); lucide.createIcons(); };
    </script>
</body>
</html>
